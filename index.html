<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Syringe Reading Trainer</title>

<style>

body{
    font-family:Arial,Helvetica,sans-serif;
    margin:10px;
    background:#f5f5f5;
}

h1{
    text-align:center;
    margin:5px 0;
    font-size:30px;
}

#mainContainer{
    max-width:1400px;
    margin:auto;
}

#topBar{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    margin-bottom:20px;
}

.moduleBtn{
    width:260px;
    padding:12px 18px;
    font-size:16px;
    cursor:pointer;
    border:none;
    background:#1976d2;
    color:white;
    border-radius:6px;
}

.moduleBtn{
    padding:10px 18px;
    font-size:16px;
    cursor:pointer;
    border:none;
    background:#1976d2;
    color:white;
    border-radius:6px;
}

.moduleBtn:hover{
    background:#1565c0;
}

#statusBar{
    margin-top:10px;
    margin-bottom:20px;
    font-size:18px;
    text-align:center;
}

#questionArea{
    background:white;
    padding:12px;
    border-radius:8px;
    margin-bottom:20px;
    box-shadow:0 0 5px rgba(0,0,0,.15);
}

#questionText{
    font-size:26px;
    text-align:center;
    margin-bottom:10px;
}

#feedback{
    position:fixed;
    top:50px;

    left:50%;
    transform:translateX(-50%);

    z-index:9999;

    background:white;
    border:2px solid #ccc;

    padding:12px 20px;

    text-align:center;
    font-size:20px;
    font-weight:bold;

    box-shadow:0 4px 12px rgba(0,0,0,.25);

}

.correct{

}

.incorrect{

}

#syringeContainer{
    display:flex;
    justify-content:center;
    margin-top:5px;
    margin-bottom:5px;
}

#controls{

}

.actionBtn{

#answerBox{

#moduleInfo{

svg{

}

}

/* =======================================
MODULE 3 LAYOUT
======================================= */

#module3Layout{
    display:none;
    justify-content:center;
    align-items:flex-start;
    gap:30px;
    margin-top:10px;
    width:100%;
    box-sizing:border-box;
}

#module3DoseInfo{
    text-align:left;
    font-size:18px;
    min-width:250px;
    box-sizing:border-box;
}

    display:none;
    box-sizing:border-box;
}

#module3StepLabel{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    margin-top:15px;
}


/* =======================================
MODULE 3 - MOBILE / TOUCH DEVICES
======================================= */

@media (max-width:1000px),
       (pointer: coarse) and (hover: none){

    #module3Layout{
        flex-direction:column !important;

        align-items:center !important;
        justify-content:flex-start !important;

        width:100% !important;
        max-width:100% !important;

        gap:15px !important;
        margin-top:10px !important;

        box-sizing:border-box !important;

        /*
        IMPORTANT:
        JavaScript controls visibility.
        This rule only controls the layout

        */

    /* Starting volume + dose information */

        display:block !important;

        width:100% !important;
        min-width:0 !important;
        max-width:100% !important;

        text-align:center !important;

        font-size:18px !important;

        box-sizing:border-box !important;

    /* Dose results table */
    #module3TableArea{
        width:100% !important;
        min-width:0 !important;
        max-width:100% !important;

        overflow-x:auto !important;
        overflow-y:hidden !important;

        margin:0 auto !important;

        box-sizing:border-box !important;

        /*
        IMPORTANT:
        Do NOT set display here.

        JavaScript controls whether the table
        is visible.
        */
    }

    #module3Table{
        width:100% !important;
        min-width:0 !important;
        max-width:100% !important;

        margin:0 auto !important;

        font-size:14px !important;

        table-layout:fixed !important;

        box-sizing:border-box !important;
    }

    #module3Table th,
    #module3Table td{
        padding:6px 4px !important;
        white-space:nowrap !important;
        overflow:hidden !important;
    }

    #module3Table th:nth-child(1),
    #module3Table td:nth-child(1){
        width:30% !important;
    }

    #module3Table th:nth-child(2),
    #module3Table td:nth-child(2){
        width:35% !important;
    }

    #module3Table th:nth-child(3),

        width:35% !important;
    }

    /* Current Step */

        width:100% !important;

        font-size:18px !important;

        margin-top:10px !important;

    /* Syringe */
    #syringeContainer{

        overflow:hidden !important;

        box-sizing:border-box !important;
    }

    #syringeSVG{
        width:100% !important;
        max-width:100% !important;

        height:auto !important;

        display:block !important;
    }

    /* Buttons */

        width:100% !important;
        box-sizing:border-box !important;
    }

    .actionBtn{
        max-width:100%;
    }
}

</style>

<script>

/* ---------------------------------------
CONFIGURATION
--------------------------------------- */

const BARREL_X = 120;
const BARREL_WIDTH = 1000;

const MAX_VOLUME = 1.00;
const NOTCHES = 100;

/* ---------------------------------------
DRAW SCALE
--------------------------------------- */

const scaleGroup =
document.getElementById("scaleGroup");

for(let i=0;i<=100;i++){

    let x =
    BARREL_X +
    (i * (BARREL_WIDTH/100));

    let tickHeight;

    if(i % 10 === 0){
        tickHeight = 60;
    }
    else if(i % 5 === 0){
        tickHeight = 40;
    }
    else{
        tickHeight = 25;
    }

    let line =
    document.createElementNS(
        "http://www.w3.org/2000/svg",
        "line"
    );

    line.setAttribute("x1",x);
    line.setAttribute("x2",x);
    line.setAttribute("y1",150);
    line.setAttribute(
        "y2",
        150 + tickHeight
    );

    line.setAttribute("stroke","black");
    line.setAttribute("stroke-width","1");

    scaleGroup.appendChild(line);

    if(i % 10 === 0 && i !== 0){

        let label =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text"
        );

        label.setAttribute("x",x-10);
        label.setAttribute("y",145);

        label.setAttribute(
            "font-size",
            "18"
        );

        label.textContent =
        (i/100).toFixed(1);

        scaleGroup.appendChild(label);
    }
}

let mlLabel =
document.createElementNS(
    "http://www.w3.org/2000/svg",
    "text"
);

mlLabel.setAttribute("x",1140);
mlLabel.setAttribute("y",145);
mlLabel.setAttribute("font-size","18");
mlLabel.textContent="mL";

scaleGroup.appendChild(mlLabel);

/* ---------------------------------------
PART 2 GOES BELOW THIS LINE
--------------------------------------- */

/* =======================================
SYRINGE STATE
======================================= */

let currentVolume = 0.00;

let dragging = false;

let dragOffset = 0;

let syringeSVG =
document.getElementById("syringeSVG");

let fluid =
document.getElementById("fluid");

let plungerFace =
document.getElementById("plungerFace");

let plungerShaft =
document.getElementById("plungerShaft");

let plungerHandle =
document.getElementById("plungerHandle");

let correctMarker =
document.getElementById("correctMarker");

/* =======================================
VOLUME <-> PIXEL CONVERSION
======================================= */

function volumeToX(volume){

    return BARREL_X +
    (
        volume *
        BARREL_WIDTH
    );

}

function xToVolume(x){

    let volume =
    (x - BARREL_X) /
    BARREL_WIDTH;

    volume =
    Math.max(
        0,
        Math.min(
            1,
            volume
        )
    );

    return volume;

}

/* =======================================
MOVE SYRINGE GRAPHICS
======================================= */

function setVolume(volume){

    volume =
    Math.max(
        0,
        Math.min(
            1,
            volume
        )
    );

    currentVolume = volume;

    let x =
    volumeToX(volume);

    fluid.setAttribute(
        "width",
        x - BARREL_X
    );

    plungerFace.setAttribute(
        "x",
        x - 4
    );

    plungerShaft.setAttribute(
        "x",
        x
    );

    plungerShaft.setAttribute(
        "width",
        120
    );

    plungerHandle.setAttribute(
        "transform",
        `translate(${x+120},0)`
    );

}
/* =======================================
SNAP TO NOTCHES
======================================= */

function snapVolume(volume){

    return (
        Math.round(volume * 100)
        / 100
    );

}

/* =======================================
POINTER POSITION / MOBILE-SAFE SVG MAPPING
======================================= */

/*
    IMPORTANT:
    Do NOT calculate SVG coordinates using:

        (clientX - rect.left) / rect.width

    because the SVG uses:

        preserveAspectRatio="xMidYMid meet"

    On mobile, the displayed SVG can have scaling/letterboxing
    that makes the HTML rectangle different from the actual
    SVG coordinate system.

    Instead, getScreenCTM() converts the phone/desktop screen
    coordinates directly into SVG viewBox coordinates.
*/

function getSVGPoint(clientX, clientY){

    const point =
        syringeSVG.createSVGPoint();

    point.x = clientX;
    point.y = clientY;

    const svgPoint =
        point.matrixTransform(
            syringeSVG
                .getScreenCTM()
                .inverse()
        );

    return {
        x: svgPoint.x,
        y: svgPoint.y
    };

}


/* =======================================
START POINTER DRAG
======================================= */

function startPointerDrag(e){

    if(currentModule === 4){
        return;
    }

    dragging = true;

    /*
        Capture the pointer so movement continues to be
        received even if the user's finger moves slightly
        outside the plunger element.
    */

    try{
        e.currentTarget.setPointerCapture(e.pointerId);
    }
    catch(err){
        /* Some browsers may not support pointer capture */
    }

    const pt =
        getSVGPoint(
            e.clientX,
            e.clientY
        );

    const plungerX =
        volumeToX(currentVolume);

    /*
        Preserve the point where the user grabbed the
        plunger instead of forcing the plunger center
        underneath the finger.
    */

    dragOffset =
        pt.x - plungerX;

    e.preventDefault();

}


/* =======================================
POINTER DRAGGING
======================================= */

function movePointerDrag(e){

    if(!dragging){
        return;
    }

    e.preventDefault();

    const pt =
        getSVGPoint(
            e.clientX,
            e.clientY
        );

    const volume =
        xToVolume(
            pt.x - dragOffset
        );

    setVolume(volume);

}


/* =======================================
END POINTER DRAG
======================================= */

function endPointerDrag(e){

    if(!dragging){
        return;
    }

    dragging = false;

    /*
        Snap to the nearest 0.01 mL notch after releasing.
    */

    currentVolume =
        snapVolume(
            currentVolume
        );

    setVolume(
        currentVolume
    );

    try{

        if(
            e.currentTarget &&
            e.currentTarget.releasePointerCapture
        ){

            e.currentTarget.releasePointerCapture(
                e.pointerId
            );

        }

    }
    catch(err){
        /* Ignore pointer capture release errors */
    }

}


/* =======================================
POINTER EVENT LISTENERS
======================================= */

/*
    Pointer Events handle:

        - Desktop mouse
        - Mobile touchscreen
        - Stylus

    This replaces the old separate mouse + touch
    event system.
*/

plungerHandle.addEventListener(
    "pointerdown",
    startPointerDrag
);

plungerFace.addEventListener(
    "pointerdown",
    startPointerDrag
);

plungerShaft.addEventListener(
    "pointerdown",
    startPointerDrag
);


/*
    Movement is attached to the window so the drag
    continues even if the finger leaves the plunger.
*/

window.addEventListener(
    "pointermove",
    movePointerDrag,
    {
        passive:false
    }
);


/*
    Release can happen anywhere on the screen.
*/

window.addEventListener(
    "pointerup",
    endPointerDrag
);

window.addEventListener(
    "pointercancel",
    endPointerDrag
);

/* =======================================
HELPERS
======================================= */

function randomInt(min,max){

    return Math.floor(
        Math.random() *
        (max-min+1)
    ) + min;

}

function randomVolume(){

    return (
        randomInt(0,100)
        / 100
    );

}

/* =======================================
DISPLAY FORMATTING
======================================= */

function volumeTextML(v){

    return v.toFixed(2)
    + " mL";

}

function volumeTextUL(v){

    return Math.round(
        v * 1000
    ) + " µL";

}

/* =======================================
RANDOM UNIT GENERATOR
======================================= */

function randomUnit(){

    return Math.random() < 0.5
    ? "mL"
    : "uL";

}

function formatVolume(v,unit){

    if(unit === "mL"){

        return volumeTextML(v);

    }

    return volumeTextUL(v);

}

/* =======================================
QUESTION STORAGE
======================================= */

let currentModule = 0;

let currentQuestion = 0;

let totalQuestions = 10;

let correctAnswers = 0;

let missedQuestions = [];

let reviewMode = false;

let reviewQuestions = [];

let reviewIndex = 0;

let activeQuestion = null;

/* =======================================
UI REFERENCES
======================================= */

const questionText =
document.getElementById(
    "questionText"
);

const feedback =
document.getElementById(
    "feedback"
);

const correctCount =
document.getElementById(
    "correctCount"
);

const questionNumber =
document.getElementById(
    "questionNumber"
);

const questionTotal =
document.getElementById(
    "questionTotal"
);

const typedAnswer =
document.getElementById(
    "typedAnswer"
);


const summaryScreen =
document.getElementById(
    "summaryScreen"
);

const moduleInfo =
document.getElementById(
    "moduleInfo"
);

/* =======================================
RESET FEEDBACK
======================================= */

function clearFeedback(){

    feedback.textContent = "";

    feedback.className = "";

    feedback.style.display =
    "none";

}

/* =======================================
UPDATE SCORE UI
======================================= */

function updateScoreDisplay(){

    correctCount.textContent =
    correctAnswers;

    questionNumber.textContent =
    currentQuestion;

    questionTotal.textContent =
    totalQuestions;

}

/* =======================================
RESET SESSION
======================================= */

function resetSession(){

    currentQuestion = 0;

    correctAnswers = 0;

    missedQuestions = [];

    reviewMode = false;

    activeQuestion = null;

    summaryScreen.style.display =
    "none";

    clearFeedback();

    updateScoreDisplay();

}

/* =======================================
START POSITION
======================================= */

setVolume(0.00);

/* =======================================
PART 3 STARTS BELOW THIS LINE
======================================= */

const checkBtn = document.getElementById("checkBtn");
const nextBtn = document.getElementById("nextBtn");
const resetPlungerBtn = document.getElementById("resetPlungerBtn");
const summaryText = document.getElementById("summaryText");
const reviewArea = document.getElementById("reviewArea");
const dose1Btn = document.getElementById("dose1Btn");

const dose2Btn =document.getElementById("dose2Btn");

const dose3Btn =document.getElementById("dose3Btn");

const module3PrevBtn =
document.getElementById(
"module3PrevBtn"
);

const module3CheckBtn =
document.getElementById(
"module3CheckBtn"
);
const module3TableArea =document.getElementById("module3TableArea");

const homeScreen =document.getElementById("homeScreen");

const gameScreen =document.getElementById("gameScreen");

let module3Step = 0;
let module3Answers = [];
let resetVolume = 0;
/* =======================================
MODULE START
======================================= */

function startModule(module){

    homeScreen.style.display =
    "none";

    gameScreen.style.display =
    "block";

    currentModule = module;

    resetSession();

    if(module === 3){

        totalQuestions = 3;

    }
    else{

        totalQuestions = 5;

    }

    updateScoreDisplay();

    generateQuestion();

}


function goHome(){

    gameScreen.style.display =
    "none";

    homeScreen.style.display =
    "block";

    summaryScreen.style.display =
    "none";

    reviewMode = false;

    currentQuestion = 0;

    correctAnswers = 0;

    missedQuestions = [];

    clearFeedback();

    setVolume(0);

    questionText.textContent =
    "Question will appear here";

    moduleInfo.textContent =
    "Choose a module";

    updateScoreDisplay();

}

/* =======================================
QUESTION GENERATOR
======================================= */

function generateQuestion(){

    clearFeedback();

    plungerHandle.style.opacity =
    "1";

    plungerHandle.style.cursor =
    "grab";

    correctMarker.style.display =
    "none";

    summaryScreen.style.display =
    "none";

    currentQuestion++;

    updateScoreDisplay();

    typedAnswer.style.display =
    "none";

    resetPlungerBtn.style.display =
    "none";

    document.getElementById(
    "module3Layout"
    ).style.display =
    "none";

    module3TableArea.style.display =
    "none";

    document.getElementById(
    "module3StepLabel"
    ).textContent = "";

    dose1Btn.style.display =
    "none";

    dose2Btn.style.display =
    "none";

    dose3Btn.style.display =
    "none";

    dose3Btn.textContent =
    "Submit Third Dose";

    module3PrevBtn.style.display =
    "none";

    module3CheckBtn.style.display =
    "none";

    nextBtn.style.display =
    "none";

    checkBtn.style.display =
    "inline-block";

    if(currentModule === 1){

    else if(currentModule === 2){

    }

    else if(currentModule === 4){
        buildModule4();
    }

}

/* =======================================
MODULE 1
DRAW UP VOLUME
======================================= */

function buildModule1(){

    randomVolume();

/* =======================================
MODULE 2
SINGLE DOSE
======================================= */

function buildModule2(){

    let start =
    (randomInt(20,100))/100;

    let dose =
    (randomInt(1,start*100))/100;

    let final =
    snapVolume(start-dose);

    let unit =
    randomUnit();

    activeQuestion = {

        start:start,
        dose:dose,
        unit:unit,
        answer:final

    };

    resetVolume = start;

    setVolume(start);

    resetPlungerBtn.style.display =
    "inline-block";

    moduleInfo.textContent =
    "Mode 2 - Single Dose";

    questionText.innerHTML =

    "<b>Starting Volume:</b> " +
    volumeTextML(start) +

    "<br><br>" +

    "<b>Give Dose:</b> " +
    formatVolume(dose,unit) +

    "<br><br>" +

    "Move plunger to final volume.";

}

/* =======================================
MODULE 3
THREE DOSES
======================================= */

function buildModule3(){

    moduleInfo.textContent =
    "Mode 3 - Three Doses from One Syringe";

    let start =
    (randomInt(60,100))/100;

    let dose1 =
    randomInt(5,20)/100;

    let dose2 =
    randomInt(5,20)/100;

    let dose3 =
    randomInt(5,20)/100;

    while(
        dose1 + dose2 + dose3 >= start
    ){

        dose1 =
        randomInt(5,20)/100;

        dose2 =
        randomInt(5,20)/100;

        dose3 =
        randomInt(5,20)/100;

    }

    activeQuestion = {

        start:start,

        doses:[
            dose1,
            dose2,
            dose3
        ],

        answers:[

            snapVolume(start-dose1),

            snapVolume(
                start-dose1-dose2
            ),

            snapVolume(
                start-dose1-dose2-dose3
            )

        ]

    };

    resetVolume = start;

    setVolume(start);

    module3Step = 0;

    module3Answers = [];

    document.getElementById(
        "module3Layout"
    ).style.display =
    "flex";

    module3TableArea.style.display =
    "block";

    document.getElementById(
        "userDose1"
    ).textContent = "-";

    document.getElementById(
        "userDose2"
    ).textContent = "-";

    document.getElementById(
        "userDose3"
    ).textContent = "-";

    document.getElementById(
        "correctDose1"
    ).textContent = "-";

    document.getElementById(
        "correctDose2"
    ).textContent = "-";

    document.getElementById(
        "correctDose3"
    ).textContent = "-";

    dose1Btn.style.display =
    "inline-block";

    dose2Btn.style.display =
    "none";

    dose3Btn.style.display =
    "none";

    dose3Btn.textContent =
    "Submit Third Dose";

    module3PrevBtn.style.display =
    "none";

    module3CheckBtn.style.display =
    "none";

    checkBtn.style.display =
    "none";

    nextBtn.style.display =
    "none";

    resetPlungerBtn.style.display =
    "inline-block";

    updateModule3Question();

}

function updateModule3Question(){

    questionText.innerHTML =
    "<b>Starting Volume:</b> " +
    volumeTextML(
        activeQuestion.start
    );

    document.getElementById(
        "module3Layout"
    ).style.display =
    "flex";

    document.getElementById(
        "module3DoseInfo"
    ).innerHTML =

        "<b>Dose 1:</b> " +
        volumeTextML(
            activeQuestion.doses[0]
        ) +

        "<br><br>" +

        "<b>Dose 2:</b> " +
        volumeTextML(
            activeQuestion.doses[1]
        ) +

        "<br><br>" +

        "<b>Dose 3:</b> " +
        volumeTextML(
            activeQuestion.doses[2]
        );

    let stepText = "";

    if(module3Step === 0){
        stepText =
        "Current Step: Dose 1";
    }
    else if(module3Step === 1){
        stepText =
        "Current Step: Dose 2";
    }
    else if(module3Step === 2){
        stepText =
        "Current Step: Dose 3";
    }
    else{
        stepText =
        "Click Submit Answer";
    }

    document.getElementById(
        "module3StepLabel"
    ).textContent =
    stepText;

}

/* =======================================
MODULE 4
READ VOLUME

function buildModule4(){

        activeQuestion.answer
    );

}

function rebuildModule2Review(){

    setVolume(

    );

    resetPlungerBtn.style.display =

    moduleInfo.textContent =

function rebuildModule3Review(){

    );

    setVolume(
        activeQuestion.answer
    );

    typedAnswer.style.display =
    "inline-block";

    typedAnswer.value = "";

    moduleInfo.textContent =
    "Review - Mode 4";

    questionText.innerHTML =

    "What volume is shown?<br><br>" +

    "Answer in <b>" +

    "</b>";

}

/* =======================================
CHECK ANSWER
======================================= */

checkBtn.addEventListener(
"click",
function(){

    if(currentModule === 1){

        let correct =
        currentVolume ===
        activeQuestion.answer;

        gradeQuestion(correct);

    }

    else if(currentModule === 2){

        let correct =
        currentVolume ===
        activeQuestion.answer;

        gradeQuestion(correct);

    }

    else if(currentModule === 4){

        let answer =
        Number(
            typedAnswer.value
        );

        let expected;

        if(
            activeQuestion.unit
            === "mL"
        ){
            expected =
            Number(
                activeQuestion.answer
                .toFixed(2)
            );
        }
        else{

            expected =
            Math.round(
                activeQuestion.answer
                *1000
            );

        }

        let correct =
        answer === expected;

        gradeQuestion(correct);

    }

});

/* =======================================
GLOBAL ENTER KEY SUPPORT
======================================= */

document.addEventListener(
"keydown",
function(e){

    if(e.key !== "Enter"){
        return;
    }

    /* -----------------------------
       MODULE 3 SPECIAL FLOW
    ------------------------------ */

    if(currentModule === 3){

            return;
        }

        if(
            dose2Btn.style.display !==
            "none"
        ){
            dose2Btn.click();
            return;
        }

        if(
            dose3Btn.style.display !==
            "none"
        ){
            dose3Btn.click();
            return;
        }

        if(
            module3CheckBtn.style.display !==
            "none"
        ){
            module3CheckBtn.click();
            return;
        }

        if(
            nextBtn.style.display !==
            "none"
        ){
            nextBtn.click();
            return;
        }

    }

    /* -----------------------------
       MODULES 1,2,4
    ------------------------------ */

    else{

        if(
            checkBtn.style.display !==
            "none"
        ){

            checkBtn.click();
            return;

        }

        if(
            nextBtn.style.display !==

        ){

            return;

        }

    }

}
);

/* =======================================
MODULE 3 BUTTONS
======================================= */

dose1Btn.addEventListener(
"click",
function(){

    module3Answers[0] =
    currentVolume;

    document.getElementById(
        "userDose1"
    ).textContent =
    volumeTextML(currentVolume);

    module3Step = 1;

    dose1Btn.style.display =

    dose2Btn.style.display =
    "inline-block";

    module3PrevBtn.style.display =
    "inline-block";

    resetVolume =
    activeQuestion.answers[0];

    updateModule3Question();

}
);

dose2Btn.addEventListener(
"click",
function(){

    module3Answers[1] =
    currentVolume;

    document.getElementById(
        "userDose2"
    ).textContent =
    volumeTextML(currentVolume);

    module3Step = 2;

    dose2Btn.style.display =
    "none";

    dose3Btn.style.display =
    "inline-block";

    resetVolume =
    activeQuestion.answers[1];

    updateModule3Question();

}
);

dose3Btn.addEventListener(
"click",
function(){

    module3Answers[2] =
    currentVolume;

    document.getElementById(
        "userDose3"
    ).textContent =
    volumeTextML(currentVolume);

    module3Step = 3;

    updateModule3Question();

    dose3Btn.textContent =
    "Submit Answer";

    dose3Btn.onclick =
    function(){

        let allCorrect = true;

        for(
            let i=0;
            i<3;
            i++
        ){

            document.getElementById(
                "correctDose" + (i+1)
            ).textContent =
            volumeTextML(
                activeQuestion.answers[i]
            );

            if(
                module3Answers[i] !==
                activeQuestion.answers[i]
            ){
                allCorrect = false;
            }

        }

        gradeQuestion(
            allCorrect
        );

    };

}
);

module3PrevBtn.addEventListener(
"click",
function(){

    if(module3Step === 1){

        module3Step = 0;

        dose1Btn.style.display =
        "inline-block";

        dose2Btn.style.display =
        "none";

        module3PrevBtn.style.display =
        "none";

        setVolume(
            activeQuestion.start
        );

    }

    else if(module3Step === 2){

        module3Step = 1;

        dose2Btn.style.display =
        "inline-block";

        dose3Btn.style.display =
        "none";

        setVolume(
            activeQuestion.answers[0]
        );

    }

    else if(module3Step === 3){

        module3Step = 2;

        dose3Btn.style.display =
        "inline-block";

        module3CheckBtn.style.display =
        "none";

        setVolume(
            activeQuestion.answers[1]
        );

    }

    updateModule3Question();

}
);

module3CheckBtn.addEventListener(
"click",
function(){

    let allCorrect = true;

    for(
        let i=0;
        i<3;
        i++
    ){

        document.getElementById(
            "correctDose" + (i+1)
        ).textContent =
        volumeTextML(
            activeQuestion.answers[i]
        );

        if(
            module3Answers[i]
            !==
            activeQuestion.answers[i]
        ){
            allCorrect = false;
        }

    }

    module3CheckBtn.style.display =
    "none";

    gradeQuestion(
        allCorrect
    );

}
);

resetPlungerBtn.addEventListener(
"click",
function(){

    setVolume(
        resetVolume
    );

});

/* =======================================
GRADE QUESTION
======================================= */

function gradeQuestion(correct){

    if(correct){

        feedback.textContent =
        "Correct";

        feedback.className =
        "correct";

        feedback.style.display =
        "block";

        correctAnswers++;

        correctMarker.style.display =
        "none";

    }
    else{

        feedback.className =
        "incorrect";

        feedback.style.display =
        "block";

        if(currentModule === 1){

            feedback.innerHTML =

            "Incorrect<br><br>" +

            "Correct answer: " +

            volumeTextML(
                activeQuestion.answer
            );

            let x =
            volumeToX(
                activeQuestion.answer
            );

            correctMarker.setAttribute(
                "x1",
                x
            );

            correctMarker.setAttribute(
                "x2",
                x
            );

            correctMarker.style.display =
            "block";

        }
        else if(currentModule === 2){

            feedback.innerHTML =

            "Incorrect<br><br>" +

            "Final volume should be: " +

            volumeTextML(
                activeQuestion.answer
            );

            let x =
            volumeToX(
                activeQuestion.answer
            );

            correctMarker.setAttribute(
                "x1",
                x
            );

            correctMarker.setAttribute(
                "x2",
                x
            );

            correctMarker.style.display =
            "block";

        }
        else if(currentModule === 4){

            let expected;

            if(
                activeQuestion.unit ===
                "mL"
            ){

                expected =
                activeQuestion.answer
                .toFixed(2)
                + " mL";

            }
            else{

                expected =
                Math.round(
                    activeQuestion.answer *
                    1000
                )
                + " µL";

            }

            feedback.innerHTML =

            "Incorrect<br><br>" +

            "Correct answer: " +

            expected;

            correctMarker.style.display =
            "none";

        }
        else{

            feedback.textContent =
            "Incorrect";

            correctMarker.style.display =
            "none";

        }

        missedQuestions.push(
            structuredClone(
                activeQuestion
            )
        );

    }

    updateScoreDisplay();

    checkBtn.style.display =
    "none";

    dose1Btn.style.display =
    "none";

    dose2Btn.style.display =
    "none";

    dose3Btn.style.display =
    "none";

    module3PrevBtn.style.display =
    "none";

    module3CheckBtn.style.display =
    "none";

    nextBtn.style.display =
    "inline-block";

}

/* =======================================
NEXT QUESTION
======================================= */

nextBtn.addEventListener(
"click",
function(){

    if(
        currentQuestion
        >= totalQuestions
    ){

        showSummary();

        return;

    }

    if(reviewMode){

        generateReviewQuestion();

    }
    else{

        generateQuestion();

    }

});

/* =======================================
SUMMARY
======================================= */

function showSummary(){

    summaryScreen.style.display =
    "block";

    summaryText.innerHTML =

    "<h3>Results</h3>" +

    "Correct: " +
    correctAnswers +
    " / " +
    totalQuestions +

    "<br><br>" +

    "Accuracy: " +

    (
        (
            correctAnswers /
            totalQuestions
        ) * 100
    ).toFixed(1)

    + "%";

    reviewArea.innerHTML = "";

    if(
        missedQuestions.length > 0
    ){

        let btn =
        document.createElement(
            "button"
        );

        btn.className =
        "actionBtn";

        btn.textContent =
        "Review Missed Questions (" +
        missedQuestions.length +
        ")";

        btn.onclick =
        startReview;

        reviewArea.appendChild(btn);

    }

}

/* =======================================
REVIEW MODE
======================================= */

function startReview(){

    reviewMode = true;

    reviewQuestions =
    JSON.parse(
        JSON.stringify(
            missedQuestions
        )
    );

    reviewIndex = 0;

    correctAnswers = 0;

    currentQuestion = 0;

    totalQuestions =
    reviewQuestions.length;

    missedQuestions = [];

    summaryScreen.style.display =
    "none";

    correctMarker.style.display =
    "none";

    generateReviewQuestion();

}

function generateReviewQuestion(){

    clearFeedback();

    correctMarker.style.display =
    "none";

    currentQuestion++;

    updateScoreDisplay();

    activeQuestion =
    reviewQuestions[
        reviewIndex
    ];

    reviewIndex++;

    nextBtn.style.display =
    "none";

    checkBtn.style.display =
    "inline-block";

    typedAnswer.style.display =
    "none";

    resetPlungerBtn.style.display =
    "none";

    document.getElementById(
        "module3Layout"
    ).style.display =
    "none";

    dose1Btn.style.display =
    "none";

    dose2Btn.style.display =
    "none";

    dose3Btn.style.display =
    "none";

    module3PrevBtn.style.display =
    "none";

    module3CheckBtn.style.display =
    "none";

    if(currentModule === 1){

        rebuildModule1Review();

    }
    else if(currentModule === 2){

        rebuildModule2Review();

    }
    else if(currentModule === 3){

        rebuildModule3Review();

    }
    else if(currentModule === 4){

        rebuildModule4Review();

    }

}

/* =======================================
INITIAL DISPLAY
======================================= */

updateScoreDisplay();

/* =======================================
END OF FILE
======================================= */

</script>
